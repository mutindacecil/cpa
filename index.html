<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050b17">
<title>Cavenor Project Advisory</title>
<style>
:root{--navy:#050b17;--gold:#d4af37;--line:#d4af37}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;background:var(--navy)}
body{overflow-x:hidden}
.blueprint-background{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background-color:#050b17;background-image:linear-gradient(rgba(212,175,55,.075) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,55,.075) 1px,transparent 1px),linear-gradient(rgba(229,231,235,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(229,231,235,.025) 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px;background-position:-1px -1px}
.blueprint-background:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 18%,rgba(0,3,10,.48) 100%),linear-gradient(135deg,rgba(0,3,10,.18),rgba(0,3,10,.42))}
.blueprint-svg{position:absolute;width:100%;height:100%;inset:0;opacity:.56}
.landing-image{position:relative;z-index:1;width:100%;height:auto;min-height:0;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
.landing-image img{display:block;width:100%;height:auto;max-width:100%;max-height:none;object-fit:contain;object-position:top center}
.blueprint-continuation{position:relative;z-index:1;min-height:100vh;background:transparent}
.site-nav{position:absolute;z-index:3;top:77%;left:50%;transform:translateX(-50%);width:min(94%,1500px);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(2px,.9vw,14px)}
.site-nav a{min-width:0;min-height:clamp(30px,5.2vw,72px);display:flex;align-items:center;justify-content:center;padding:clamp(4px,1.2vw,17px) clamp(2px,.8vw,12px);border:1.5px solid rgba(212,175,55,.9);border-radius:12px;background:rgba(5,11,23,.24);color:#fffaf0;text-decoration:none;text-align:center;font:700 clamp(5px,.95vw,15px)/1.15 Arial,sans-serif;letter-spacing:clamp(0em,.1vw,.11em);white-space:normal;overflow-wrap:anywhere;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);transition:background .22s ease,color .22s ease,border-color .22s ease,transform .22s ease}
.site-nav a:hover,.site-nav a:focus-visible{background:rgba(212,175,55,.88);color:#050b17;border-color:#f0d58a;transform:translateY(-3px);outline:none}
@media(max-width:900px){.site-nav{top:77%;width:96%;gap:clamp(2px,.65vw,6px)}.site-nav a{min-height:clamp(32px,5.2vw,48px);font-size:clamp(7px,1.45vw,13px);padding:5px 2px;letter-spacing:0;border-radius:12px}}
@media(max-width:560px){.site-nav{top:77%;width:98%;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}.site-nav a{min-height:clamp(32px,9vw,42px);padding:4px 1px;font-size:clamp(5px,1.7vw,9px);line-height:1.1;letter-spacing:0;border-radius:12px;border-width:1px}}
@media(prefers-reduced-motion:no-preference){.landing-image img{animation:reveal .8s ease-out both}@keyframes reveal{from{opacity:.85}to{opacity:1}}}
</style>
</head>
